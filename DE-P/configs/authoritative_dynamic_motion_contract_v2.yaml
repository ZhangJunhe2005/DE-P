contract_version: authoritative_dynamic_motion_contract_v2
coordinate_frame: world
time_unit: seconds
velocity_unit: meters_per_second
acceleration_unit: meters_per_second_squared
frozen_perception:
  dynamic_enter_speed_mps: 0.30
  dynamic_exit_speed_mps: 0.15
  confirmation_hits: 3
  motion_consistency_frames: 2
  maximum_missed_frames: 3
  speed_source: world_frame_linear_kalman_track_state
  observation_source: causal_depth_range_image_hybrid
sampling:
  actor_radius_m: 0.30
  uav_radius_m: 0.30
  actor_uav_clearance_margin_m: 0.10
  actor_actor_clearance_margin_m: 0.10
  actor_static_clearance_margin_m: 0.05
  minimum_speed_margin_above_enter_mps: 0.50
  minimum_sustained_dynamic_duration_s: 0.30
  maximum_detection_center_distance_m: 1.80
  maximum_detection_entry_time_s: 1.20
  continuous_sample_spacing_m: 0.05
  maximum_random_attempts: 128
  maximum_motion_joint_attempts: 64
  deterministic_lattice_forward_m: [1.2, 1.8, 2.5, 3.2, 4.0, 5.0, 6.0]
  deterministic_lattice_lateral_m: [0.8, -0.8, 1.2, -1.2, 1.8, -1.8, 2.4, -2.4]
  deterministic_lattice_vertical_m: [0.0, 0.35, -0.35, 0.7, -0.7]
  fallback_policy: deterministic_swept_volume_lattice_never_zero_speed
  seed_policy: dataset_sequence_seed_only
validation:
  speed_absolute_tolerance_mps: 0.00001
  position_absolute_tolerance_m: 0.000001
  acceleration_max_mps2: 0.00001
  jerk_max_mps3: 0.00001
  renderer_pose_absolute_tolerance_m: 0.000001
  no_target_false_attention_max: 0
scenarios:
  crossing:
    actor_count: 1
    speed_range_mps: [1.45, 1.75]
    direction_profile: transverse_dominant_closing
    motion_profile: constant_velocity
  head_on:
    actor_count: 1
    speed_range_mps: [0.90, 1.20]
    direction_profile: closing_with_lateral_safety_offset
    motion_profile: constant_velocity
  temporal_separation:
    actor_count: 1
    speed_range_mps: [1.40, 1.70]
    direction_profile: transverse_time_shifted_closing
    motion_profile: constant_velocity
  static_dynamic_joint_constraint:
    actor_count: 1
    speed_range_mps: [1.40, 1.65]
    direction_profile: diagonal_static_constrained
    motion_profile: constant_velocity
  multi_target:
    actor_count: 2
    actor_radius_m: 0.20
    speed_range_mps: [1.40, 1.75]
    direction_profile: distinct_closing_transverse
    motion_profile: constant_velocity
  occluded_but_tracked:
    actor_count: 1
    speed_range_mps: [1.40, 1.70]
    direction_profile: transverse_occlusion_continuous_closing
    motion_profile: constant_velocity
    occlusion_policy: static_geometry_natural_occlusion
    occlusion_gap_frames: [1, 3]

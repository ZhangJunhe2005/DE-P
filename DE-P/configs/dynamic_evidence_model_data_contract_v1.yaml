version: dynamic_evidence_model_data_contract_v1
scope: development_contract_only
selected_model: causal_feature_temporal_dynamic_evidence_v1
fallback_model: hybrid_patch_temporal_dynamic_evidence_v1
maximum_finalists: 2
feature_dim: 32
temporal_windows: [2, 4]
classes:
  - DYNAMIC_SUPPORT
  - STATIC_SUPPORT
  - SENSOR_OR_SEGMENTATION_ARTIFACT
  - UNKNOWN_AMBIGUOUS
missing_values:
  storage_fill: 0.0
  validity_mask_required: true
  zero_velocity_without_mask_forbidden: true
preprocessing:
